name: Build Release APK

# 手动触发即可，构建已签名的 release APK
# 使用前需要在仓库 Settings → Secrets and variables → Actions 里添加：
#   KEYSTORE_BASE64   -> 你的 upload keystore(.jks) 文件用 base64 编码后的内容
#   STORE_PASSWORD    -> keystore 密码
#   KEY_PASSWORD      -> key 密码
# 生成 keystore 示例命令（本地执行一次即可）：
#   keytool -genkeypair -v -keystore my-upload-key.jks -alias upload \
#     -keyalg RSA -keysize 2048 -validity 10000
# 编码命令：
#   base64 -i my-upload-key.jks | tr -d '\n' > keystore_base64.txt
# 把 keystore_base64.txt 的内容整段粘贴进 KEYSTORE_BASE64 这个 secret

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装所需 SDK 组件
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: 还原正式签名 keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

      - name: 配置 Gradle 9.1.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.1.0

      - name: 构建 Release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 清理 keystore 文件
        if: always()
        run: rm -f my-upload-key.jks

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: warmjournal-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
